# 발행 대사 주기 실행 (Phase P5).
#
# Vercel Hobby 플랜은 크론이 하루 1회까지다. 명세가 요구하는 10분 주기는
# 거기서 못 돌리므로 여기서 부른다. Vercel 크론은 하루 1회 백스톱으로 남겨
# 두 경로가 서로를 덮는다 — Actions가 지연·중단돼도 하루 한 번은 돈다.
#
# 필요한 저장소 시크릿 두 개 (Settings → Secrets and variables → Actions):
#   RECONCILE_URL     https://<배포도메인>/api/cron/reconcile
#   CRON_SECRET       Vercel 환경변수와 같은 값
# 둘 중 하나라도 없으면 조용히 건너뛴다 — 실패 알림으로 시끄럽게 하지 않는다.

name: reconcile

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # 손으로 한 번 돌려보기

# 앞 실행이 늦어져도 겹쳐 돌지 않게 한다. 대사는 멱등이지만 체인 전송이
# 두 번 나가는 상황을 만들 이유가 없다.
concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 대사 엔드포인트 호출
        env:
          URL: ${{ secrets.RECONCILE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "RECONCILE_URL 또는 CRON_SECRET이 없어 건너뜁니다."
            exit 0
          fi
          code=$(curl -s -o body.json -w "%{http_code}" -m 60 \
            -H "Authorization: Bearer $SECRET" "$URL")
          echo "HTTP $code"
          cat body.json
          echo
          # 401/503은 설정 문제라 알아야 한다. 5xx는 서버가 잠시 죽은 것일 수
          # 있어 다음 주기에 다시 시도하면 되므로 실패로 올리지 않는다.
          case "$code" in
            200) exit 0 ;;
            401|503) echo "::error::대사 엔드포인트 설정을 확인하세요 ($code)"; exit 1 ;;
            *) echo "::warning::일시적 실패로 보고 다음 주기에 재시도합니다 ($code)"; exit 0 ;;
          esac
